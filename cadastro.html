<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduConnect - Cadastro</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>
  <div class="dashboard">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>🎓 EduConnect</h2>
        <p class="subtitle">Painel Administrativo</p>
      </div>
      <nav>
        <ul>
          <li><a href="dashboard.html">🏠 Dashboard</a></li>
          <li><a class="active" href="cadastro.html">🧍‍♂️ Cadastro</a></li>
        </ul>
      </nav>
      <div class="sidebar-footer">
        <button id="toggleTheme" class="toggle-theme">🌙 Modo Escuro</button>
      </div>
    </aside>

    <main class="content">
      <h1>Cadastrar Aluno</h1>
      <form id="formCadastro">
        <div class="form-group">
          <label for="nome">Nome</label>
          <input type="text" id="nome" required>
        </div>

        <div class="form-group">
          <label for="sobrenome">Sobrenome</label>
          <input type="text" id="sobrenome" required>
        </div>

        <div class="form-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" required maxlength="14" placeholder="000.000.000-00">
        </div>

        <div class="form-group">
          <label for="matricula">Matrícula</label>
          <input type="text" id="matricula" required>
        </div>

        <div class="form-group">
          <label for="nascimento">Data de Nascimento</label>
          <input type="date" id="nascimento" required>
        </div>

        <button type="submit">Salvar Aluno</button>
      </form>
    </main>
  </div>

  <footer class="footer">
    © 2025 EduConnect | Desenvolvido por Equipe TIVIT Trainee 💻
  </footer>

  <script src="js/main.js"></script>
  <script src="js/cadastro.js"></script>
</body>
